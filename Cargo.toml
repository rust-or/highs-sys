[package]
name = "highs-sys"
version = "1.15.0"
authors = ["Ophir LOJKINE"]
edition = "2018"
description = "Rust binding for the HiGHS linear programming solver. See http://highs.dev."
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-or/highs-sys"
keywords = ["linear-programming", "optimization", "math", "solver"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

[build-dependencies]
bindgen = "0.72"
cmake = { version = "0.1.49", optional = true }
pkg-config = { version = "0.3.27", optional = true }

[features]
default = ["build", "highs_release"]
discover = ["dep:pkg-config"]
build = ["dep:cmake"]
highs_release = []
ninja = []
libz = []
# Enable HiGHS' HiPO interior-point solver (HiGHS >= 1.14). Requires the
# `build` feature: HiPO is wired up via cmake (-DHIPO=ON) and needs a BLAS.
#
# The BLAS backend is fully configurable through HiGHS' own cmake, exposed
# via environment variables (see README): HIGHS_BUILD_OPENBLAS,
# HIGHS_BLA_VENDOR, HIGHS_BLAS_ROOT, HIGHS_NO_AVX512 and HIGHS_BLAS_LINK.
# By default, HiGHS fetches and builds OpenBLAS (a convenient fallback when
# no system BLAS is available), except on Apple targets where the system
# Accelerate framework is used.
hipo = ["build"]
